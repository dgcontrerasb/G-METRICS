    <style>
      .loader-loading-minimal {
        width: fit-content;
        font-size: 38px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 900;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 1.5px #000;
        --g: conic-gradient(#000 0 0) no-repeat text;
        background:
          var(--g) 0,
          var(--g) 1ch,
          var(--g) 2ch,
          var(--g) 3ch,
          var(--g) 4ch,
          var(--g) 5ch,
          var(--g) 6ch;
        animation:
          l20-0 1.5s linear infinite alternate,
          l20-1 3s linear infinite;
        letter-spacing: 0.05em;
        line-height: 1.2;
      }
      .loader-loading-minimal:before {
        content: "Loading";
      }
      @keyframes l20-0 {
        0% { background-size: 1ch 0, 1ch 0, 1ch 0, 1ch 0, 1ch 0, 1ch 0, 1ch 0; }
        25% { background-size: 1ch 100%, 1ch 50%, 1ch 0, 1ch 0, 1ch 0, 1ch 50%, 1ch 100%; }
        50% { background-size: 1ch 100%, 1ch 100%, 1ch 50%, 1ch 0, 1ch 50%, 1ch 100%, 1ch 100%; }
        75% { background-size: 1ch 100%, 1ch 100%, 1ch 100%, 1ch 50%, 1ch 100%, 1ch 100%; }
        to { background-size: 1ch 100%, 1ch 100%, 1ch 100%, 1ch 100%, 1ch 100%, 1ch 100%; }
      }
      @keyframes l20-1 {
        0%, 50% { background-position-y: 100%; }
        50.01%, to { background-position-y: 0; }
      }
    </style>
    <script>
      (() => {
        const origConsoleError = console.error;
        console.error = function(...args) {
          const fullText = args.map(arg => {
            if (arg instanceof Error) return `${arg.name}: ${arg.message}\n${arg.stack || ''}`;
            if (typeof arg === 'object' && arg !== null) {
              try { return JSON.stringify(arg); } catch { return String(arg); }
            }
            return String(arg ?? '');
          }).join(' ');

          if (
            fullText.includes('WebSocket closed') ||
            fullText.includes('WebSocket') ||
            fullText.includes('ServiceWorker') ||
            fullText.includes('sw.js') ||
            fullText.includes('ResizeObserver') ||
            (fullText.includes('[vite]') && (fullText.includes('WebSocket') || fullText.includes('closed') || fullText.includes('connect')))
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('error', (e) => {
          const msg = String(e?.message || '');
          const filename = String(e?.filename || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('[vite]') ||
            msg.includes('ResizeObserver') ||
            msg.includes('ServiceWorker') ||
            filename.includes('@vite/client') ||
            filename.includes('sw.js')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', (e) => {
          const reasonStr = String(e?.reason?.message || e?.reason?.stack || e?.reason || '');
          if (
            reasonStr.includes('WebSocket') ||
            reasonStr.includes('[vite]') ||
            reasonStr.includes('@vite/client') ||
            reasonStr.includes('ServiceWorker') ||
            reasonStr.includes('sw.js') ||
            reasonStr.includes('Failed to register')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        // Limpiar cualquier Service Worker antiguo en caché de desarrollo dentro del iframe de AI Studio
        if ('serviceWorker' in navigator && (window.location.hostname.includes('run.app') || window.location.hostname === 'localhost')) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const reg of registrations) {
              if (reg.active && reg.active.scriptURL && reg.active.scriptURL.includes('dev-sw')) {
                reg.unregister().catch(() => {});
              }
            }
          }).catch(() => {});
        }
      })();
    </script>
