    <script>
      // Interceptar y silenciar conexiones WebSocket de Vite HMR en el entorno de iframe de AI Studio
      (() => {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          const PatchedWebSocket = function(url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              String(url || '').includes('vite');
            if (isViteHmr) {
              const dummy = new EventTarget();
              dummy.url = String(url || '');
              dummy.readyState = 1; // OPEN
              dummy.protocol = 'vite-hmr';
              dummy.extensions = '';
              dummy.bufferedAmount = 0;
              dummy.binaryType = 'blob';
              dummy.send = function() {};
              dummy.close = function() { this.readyState = 3; };
              return dummy;
            }
            return protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        const origConsoleError = console.error;
        console.error = function(...args) {
          const fullText = args.map(arg => {
            if (arg instanceof Error) return `${arg.name}: ${arg.message}\n${arg.stack || ''}`;
            if (typeof arg === 'object' && arg !== null) {
              try { return JSON.stringify(arg); } catch { return String(arg); }
            }
            return String(arg ?? '');
          }).join(' ');

          if (
            fullText.includes('WebSocket closed') ||
            fullText.includes('WebSocket') ||
            (fullText.includes('[vite]') && (fullText.includes('WebSocket') || fullText.includes('closed') || fullText.includes('connect')))
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('error', (e) => {
          const msg = String(e?.message || '');
          const filename = String(e?.filename || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('[vite]') ||
            filename.includes('@vite/client')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', (e) => {
          const reasonStr = String(e?.reason?.message || e?.reason?.stack || e?.reason || '');
          if (
            reasonStr.includes('WebSocket') ||
            reasonStr.includes('[vite]') ||
            reasonStr.includes('@vite/client')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
